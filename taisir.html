        .back:hover {background:#2e7d32;transform:translateY(-5px);}
        img {
            width:100%;
            max-width:1100px;

        .fixed-download {
            position:fixed;
            top:20px;
            right:20px;
            background:#d32f2f;
            color:white;
            padding:14px 28px;
            font-size:22px;
            font-weight:bold;
            text-decoration:none;
            border-radius:50px;
            box-shadow:0 8px 25px rgba(211,47,47,0.5);
            z-index:9999;
            border:3px solid white;
            transition:all 0.3s;
        }
        .fixed-download:hover {
            background:#b71c1c;
            transform:scale(1.08);
        }
        @media (max-width:600px) {
            .fixed-download {
                top:15px;
                right:15px;
                padding:12px 22px;
                font-size:19px;
            }
        }
